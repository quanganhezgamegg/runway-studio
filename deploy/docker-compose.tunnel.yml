# Cloudflare Tunnel: truy cap tu xa ma KHONG mo port nao ra internet.
# cloudflared tu goi ra Cloudflare, khong co ket noi vao.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.tunnel.yml up -d
#
# Can TUNNEL_TOKEN trong .env (lay o buoc 2 trong README, muc "Host len server").

services:
  studio:
    # Chi mo tren localhost cua may chu, DONG duong LAN.
    #
    # Bat buoc phai dong, khong phai de cho chac: ben duoi bat TRUST_PROXY=1
    # de gioi han login doc duoc IP that tu Cloudflare. Neu LAN van vao truc
    # tiep duoc thi nguoi trong mang tu dat X-Forwarded-For la vuot qua gioi
    # han do. Mo mot duong la vo hieu duong con lai.
    #
    # Sau buoc nay dong nghiep vao bang ten mien Cloudflare, khong phai IP LAN.
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      RUNWAY_API_KEY: ${RUNWAY_API_KEY:?Thieu RUNWAY_API_KEY}
      PORT: "3000"
      HOST: "0.0.0.0"
      # Sau Cloudflare thi X-Forwarded-For dang tin -> gioi han login theo IP that
      TRUST_PROXY: "1"
      # Cloudflare luon phuc vu HTTPS -> cookie phien gan co Secure
      FORCE_SECURE_COOKIE: "1"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: runway-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?Thieu TUNNEL_TOKEN}
    depends_on:
      studio:
        condition: service_healthy
